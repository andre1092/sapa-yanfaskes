<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAPA Yanfaskes: Saluran Analisa Performa Pelayanan Fasilitas Kesehatan, BPJS Kesehatan" />
    <title>SAPA Yanfaskes · Saluran Analisa Performa Pelayanan Fasilitas Kesehatan</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('sapa-theme-storage');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          var hour = new Date().getHours();
          var isNight = hour < 6 || hour >= 18;
          var prefersDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var systemEffective = (isNight || prefersDark) ? 'dark' : 'light';
          var effective = theme === 'system' ? systemEffective : theme;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(effective);
          document.documentElement.style.colorScheme = effective;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
